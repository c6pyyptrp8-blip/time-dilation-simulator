
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity Time Dilation Model</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080d1b;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px;
  text-align: center;
}

h1 {
  font-size: 25px;
  margin-bottom: 8px;
}

.subtitle {
  color: #aab6d0;
  font-size: 13px;
}

main {
  max-width: 950px;
  margin: auto;
  padding: 12px;
}

.panel {
  background: #111a2d;
  border: 1px solid #283650;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 15px;
}

canvas {
  display: block;
  width: 100%;
  height: 360px;
  background: radial-gradient(#182642, #050914);
  border-radius: 12px;
}

.control {
  margin: 18px 0;
}

.control label {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 14px;
  margin-bottom: 9px;
}

input[type="range"] {
  width: 100%;
  accent-color: #65b7ff;
}

.value {
  color: #78c8ff;
  font-weight: bold;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.stat {
  padding: 13px;
  border-radius: 10px;
  background: #1a2740;
  overflow-wrap: anywhere;
}

.stat small {
  color: #aab6d0;
  display: block;
  margin-bottom: 7px;
}

.stat strong {
  font-size: 17px;
}

.blue { color: #64c8ff; }
.orange { color: #ffb86b; }
.green { color: #83e5b1; }

.note {
  font-size: 12px;
  color: #aab6d0;
  line-height: 1.6;
}

button {
  border: 0;
  padding: 10px 16px;
  border-radius: 9px;
  background: #2869c7;
  color: white;
  font-size: 14px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <h1>🌌 중력과 시간 지연</h1>
  <div class="subtitle">
    행성의 중력과 우주선의 속도에 따른 시간 흐름 비교
  </div>
</header>

<main>

<section class="panel">
  <canvas id="space"></canvas>
  <p class="note">
    행성 주변의 원은 거리를 나타내는 궤도야.
    우주선은 현재 선택한 거리에서 움직여.
    모형의 움직임은 이해를 돕기 위한 시각적 표현이야.
  </p>
</section>

<section class="panel">

<h2>조건 설정</h2>

<div class="control">
  <label>
    행성 질량
    <span class="value" id="massText">1 지구 질량</span>
  </label>
  <input id="mass" type="range" min="1" max="10"
         step="0.1" value="1">
</div>

<div class="control">
  <label>
    행성 중심으로부터 거리
    <span class="value" id="distanceText">3 지구 반지름</span>
  </label>
  <input id="distance" type="range" min="1" max="20"
         step="0.1" value="3">
</div>

<div class="control">
  <label>
    우주선 속도
    <span class="value" id="speedText">1% c</span>
  </label>
  <input id="speed" type="range" min="0" max="99"
         step="0.1" value="1">
</div>

<button id="pause">움직임 멈추기</button>

</section>

<section class="panel">

<h2>시간 지연 계산</h2>

<div class="stats">

  <div class="stat">
    <small>중력에 의한 시간 지연</small>
    <strong class="blue" id="gravity">-</strong>
  </div>

  <div class="stat">
    <small>속도에 의한 시간 지연</small>
    <strong class="orange" id="velocity">-</strong>
  </div>

  <div class="stat">
    <small>두 효과를 함께 고려한 시간 지연</small>
    <strong class="green" id="combined">-</strong>
  </div>

  <div class="stat">
    <small>두 효과가 같아지는 속도</small>
    <strong id="equalSpeed">-</strong>
  </div>

</div>

<p class="note" id="description"></p>

</section>

<section class="panel">

<h2>시간 흐름 비교</h2>

<canvas id="chart"></canvas>

<p class="note">
  가로축은 행성 중심으로부터의 거리야.
  세로축은 하루 동안 발생하는 시간 지연을
  마이크로초 단위로 나타내.
</p>

</section>

</main>

<script>

const G = 6.67430e-11;
const C = 299792458;

const ME = 5.9722e24;
const RE = 6371000;

const mass = document.getElementById("mass");
const distance = document.getElementById("distance");
const speed = document.getElementById("speed");

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

const chart = document.getElementById("chart");
const cctx = chart.getContext("2d");

let paused = false;
let angle = 0;

document.getElementById("pause").onclick = () => {
  paused = !paused;
  document.getElementById("pause").textContent =
    paused ? "움직임 시작하기" : "움직임 멈추기";
};

function values() {

  const M = Number(mass.value) * ME;
  const r = Number(distance.value) * RE;
  const v = Number(speed.value) / 100 * C;

  const rs = 2 * G * M / (C * C);

  const gravityRate = Math.sqrt(1 - rs / r);

  const speedRate = Math.sqrt(1 - v * v / (C * C));

  const combinedRate = gravityRate * speedRate;

  const gravityLoss =
    (1 - gravityRate) * 86400 * 1e6;

  const speedLoss =
    (1 - speedRate) * 86400 * 1e6;

  const combinedLoss =
    (1 - combinedRate) * 86400 * 1e6;

  const equalSpeed =
    C * Math.sqrt(rs / r);

  return {
    M, r, v, rs,
    gravityRate,
    speedRate,
    combinedRate,
    gravityLoss,
    speedLoss,
    combinedLoss,
    equalSpeed
  };
}

function updateText() {

  const x = values();

  document.getElementById("massText").textContent =
    Number(mass.value).toFixed(1) + " 지구 질량";

  document.getElementById("distanceText").textContent =
    Number(distance.value).toFixed(1) + " 지구 반지름";

  document.getElementById("speedText").textContent =
    Number(speed.value).toFixed(1) + "% c";

  document.getElementById("gravity").textContent =
    x.gravityLoss.toFixed(4) + " μs/day";

  document.getElementById("velocity").textContent =
    x.speedLoss.toFixed(4) + " μs/day";

  document.getElementById("combined").textContent =
    x.combinedLoss.toFixed(4) + " μs/day";

  document.getElementById("equalSpeed").textContent =
    (x.equalSpeed / C * 100).toFixed(3) + "% c";

  document.getElementById("description").textContent =
    "현재 조건에서 중력만 고려한 시계는 " +
    x.gravityLoss.toFixed(4) +
    " μs/day, 속도만 고려한 시계는 " +
    x.speedLoss.toFixed(4) +
    " μs/day만큼 멀리 있는 기준 시계보다 느리게 흐르는 것으로 계산돼.";
}

function resizeCanvas(c) {

  const rect = c.getBoundingClientRect();

  c.width = rect.width * devicePixelRatio;
  c.height = rect.height * devicePixelRatio;

  const context = c.getContext("2d");

  context.setTransform(
    devicePixelRatio, 0, 0,
    devicePixelRatio, 0, 0
  );

  return {
    w: rect.width,
    h: rect.height
  };
}

function drawSpace() {

  const {w, h} = resizeCanvas(canvas);
  const x = values();

  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;

  const planetR = Math.min(w, h) * 0.095;

  const maxOrbit = Math.min(w * 0.43, h * 0.43);

  // 별 배경
  for (let i = 0; i < 70; i++) {

    const sx = (i * 137.5) % w;
    const sy = (i * 83.7) % h;

    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }

  // 행성 중심
  const gradient = ctx.createRadialGradient(
    cx - planetR * 0.35,
    cy - planetR * 0.35,
    2,
    cx, cy,
    planetR * 1.5
  );

  gradient.addColorStop(0, "#8bd8ff");
  gradient.addColorStop(0.5, "#2466ba");
  gradient.addColorStop(1, "#101d45");

  ctx.beginPath();
  ctx.arc(cx, cy, planetR, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();

  // 거리 궤도
  for (let i = 1; i <= 5; i++) {

    const orbit = planetR + i * maxOrbit / 5;

    ctx.beginPath();
    ctx.arc(cx, cy, orbit, 0, Math.PI * 2);

    ctx.strokeStyle = "rgba(130,170,220,0.22)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 현재 선택 거리
  const selectedOrbit =
    planetR + (Number(distance.value) / 20) * maxOrbit;

  ctx.beginPath();
  ctx.arc(cx, cy, selectedOrbit, 0, Math.PI * 2);

  ctx.strokeStyle = "#58b9ff";
  ctx.lineWidth = 2;
  ctx.stroke();

  // 우주선 위치
  const px = cx + selectedOrbit * Math.cos(angle);
  const py = cy + selectedOrbit * Math.sin(angle);

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(angle + Math.PI / 2);

  ctx.fillStyle = "#ffbd75";

  ctx.beginPath();
  ctx.moveTo(0, -12);
  ctx.lineTo(8, 10);
  ctx.lineTo(0, 6);
  ctx.lineTo(-8, 10);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  // 시계
  const clockX = cx;
  const clockY = cy - maxOrbit * 0.95;

  ctx.beginPath();
  ctx.arc(clockX, clockY, 17, 0, Math.PI * 2);

  ctx.fillStyle = "#162943";
  ctx.fill();

  ctx.strokeStyle = "#65c7ff";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(clockX, clockY);
  ctx.lineTo(
    clockX + 10 * Math.cos(angle * 2),
    clockY + 10 * Math.sin(angle * 2)
  );

  ctx.strokeStyle = "#ffffff";
  ctx.stroke();

  ctx.fillStyle = "#ffffff";
  ctx.font = "12px Arial";
  ctx.textAlign = "center";

  ctx.fillText("행성", cx, cy + planetR + 16);
  ctx.fillText("시계", clockX, clockY - 25);
  ctx.fillText("우주선", px, py + 25);
}

function drawChart() {

  const {w, h} = resizeCanvas(chart);

  cctx.clearRect(0, 0, w, h);

  const M = Number(mass.value) * ME;
  const v = Number(speed.value) / 100 * C;

  const maxDistance = 20 * RE;

  const values = [];

  for (let i = 1; i <= 20; i += 0.2) {

    const r = i * RE;
    const rs = 2 * G * M / (C * C);

    const gravityRate = Math.sqrt(1 - rs / r);

    const gravityLoss =
      (1 - gravityRate) * 86400 * 1e6;

    const speedRate = Math.sqrt(1 - v * v / (C * C));

    const speedLoss =
      (1 - speedRate) * 86400 * 1e6;

    values.push({
      distance: i,
      gravityLoss,
      speedLoss
    });
  }

  const maxY = Math.max(
    ...values.map(p => p.gravityLoss),
    values[0].speedLoss,
    0.000001
  ) * 1.2;

  const left = 48;
  const right = w - 15;
  const top = 25;
  const bottom = h - 35;

  function X(d) {
    return left + d / 20 * (right - left);
  }

  function Y(v) {
    return bottom - v / maxY * (bottom - top);
  }

  // 축
  cctx.strokeStyle = "#64748b";
  cctx.lineWidth = 1;

  cctx.beginPath();
  cctx.moveTo(left, top);
  cctx.lineTo(left, bottom);
  cctx.lineTo(right, bottom);
  cctx.stroke();

  // 중력 그래프
  cctx.beginPath();

  values.forEach((p, i) => {

    if (i === 0) {
      cctx.moveTo(X(p.distance), Y(p.gravityLoss));
    } else {
      cctx.lineTo(X(p.distance), Y(p.gravityLoss));
    }

  });

  cctx.strokeStyle = "#58b9ff";
  cctx.lineWidth = 2.5;
  cctx.stroke();

  // 속도 그래프
  cctx.beginPath();
  cctx.moveTo(left, Y(values[0].speedLoss));
  cctx.lineTo(right, Y(values[0].speedLoss));

  cctx.strokeStyle = "#ffb86b";
  cctx.lineWidth = 2;
  cctx.stroke();

  // 현재 거리 표시
  const current = Number(distance.value);

  cctx.beginPath();
  cctx.moveTo(X(current), top);
  cctx.lineTo(X(current), bottom);

  cctx.strokeStyle = "rgba(255,255,255,0.35)";
  cctx.setLineDash([4, 4]);
  cctx.stroke();
  cctx.setLineDash([]);

  cctx.fillStyle = "#dbeafe";
  cctx.font = "11px Arial";

  cctx.textAlign = "center";
  cctx.fillText("1", X(1), bottom + 18);
  cctx.fillText("10", X(10), bottom + 18);
  cctx.fillText("20", X(20), bottom + 18);

  cctx.textAlign = "left";
  cctx.fillText("거리 (지구 반지름)", left, 13);

  cctx.fillStyle = "#58b9ff";
  cctx.fillText("중력", left + 5, top + 12);

  cctx.fillStyle = "#ffb86b";
  cctx.fillText("속도", left + 5, top + 28);
}

function animate() {

  if (!paused) {
    angle += 0.012;
  }

  drawSpace();
  requestAnimationFrame(animate);
}

[mass, distance, speed].forEach(el => {

  el.addEventListener("input", () => {
    updateText();
    drawChart();
  });

});

window.addEventListener("resize", drawChart);

updateText();
drawChart();
animate();

</script>

</body>
</html>
